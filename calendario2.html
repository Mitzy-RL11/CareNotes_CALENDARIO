<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calendario con eventos</title>
  <style>
    /* Igual que antes: estilos del calendario y eventos */
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .calendar { width: 380px; background: #fff; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin: 20px auto; }
    .calendar header { display: flex; justify-content: space-between; align-items: center; background: #4CAF50; color: #fff; padding: 15px; font-size: 1.2em; }
    .calendar header button { background: none; border: none; color: #fff; font-size: 1.5em; cursor: pointer; }
    .calendar table { width: 100%; border-collapse: collapse; text-align: center; }
    .calendar th { background: #e0f2f1; padding: 10px; font-weight: bold; }
    .calendar td { padding: 15px; border-radius: 50%; transition: background 0.3s; cursor: pointer; }
    .calendar td:hover { background: #c8e6c9; }
    .calendar .today { background: #4CAF50; color: #fff; font-weight: bold; }
    .calendar .selected { background: #2196F3; color: #fff; font-weight: bold; }
    .events { width: 350px; background: #fff; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); padding: 15px; margin: 20px auto; }
    .events h2 { margin-top: 0; font-size: 1.2em; color: #4CAF50; }
    .event-item { background: #f0f0f0; margin: 5px 0; padding: 8px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="calendar">
    <header>
      <button id="prev">&#9664;</button>
      <div id="monthYear"></div>
      <button id="next">&#9654;</button>
    </header>
    <table>
      <thead>
        <tr>
          <th>Lun</th><th>Mar</th><th>Mié</th><th>Jue</th><th>Vie</th><th>Sáb</th><th>Dom</th>
        </tr>
      </thead>
      <tbody id="calendarBody"></tbody>
    </table>
  </div>

  <div class="events">
    <h2>Eventos importantes</h2>
    <div id="eventList"></div>
    <div>
      <input type="text" id="eventInput" placeholder="Agregar nota..." style="width:80%;padding:5px;">
      <button id="addEvent">➕</button>
    </div>
  </div>

  <script>
    const monthYear = document.getElementById("monthYear");
    const calendarBody = document.getElementById("calendarBody");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const eventList = document.getElementById("eventList");
    const eventInput = document.getElementById("eventInput");
    const addEventBtn = document.getElementById("addEvent");

    let today = new Date();
    let currentMonth = today.getMonth();
    let currentYear = today.getFullYear();
    let selectedDate = null;
    let events = {};

    const months = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

    function renderCalendar(month, year) {
      monthYear.textContent = `${months[month]} ${year}`;
      calendarBody.innerHTML = "";

      let firstDay = new Date(year, month).getDay();
      firstDay = (firstDay === 0) ? 6 : firstDay - 1;

      let daysInMonth = new Date(year, month + 1, 0).getDate();
      let date = 1;

      for (let i = 0; i < 6; i++) {
        let row = document.createElement("tr");
        for (let j = 0; j < 7; j++) {
          let cell = document.createElement("td");
          if (i === 0 && j < firstDay) {
            cell.textContent = "";
          } else if (date > daysInMonth) {
            cell.textContent = "";
          } else {
            cell.textContent = date;
            if (date === today.getDate() && year === today.getFullYear() && month === today.getMonth()) {
              cell.classList.add("today");
            }
            cell.addEventListener("click", () => {
              document.querySelectorAll("td").forEach(td => td.classList.remove("selected"));
              cell.classList.add("selected");
              selectedDate = new Date(year, month, date);
              showEvents(selectedDate);
            });
            date++;
          }
          row.appendChild(cell);
        }
        calendarBody.appendChild(row);
      }
    }

    function showEvents(date) {
      let key = date.toLocaleDateString("es-MX");
      eventList.innerHTML = "";
      if (events[key]) {
        events[key].forEach(ev => {
          let div = document.createElement("div");
          div.className = "event-item";
          div.textContent = ev;
          eventList.appendChild(div);
        });
      } else {
        eventList.innerHTML = "<p>No hay eventos para este día.</p>";
      }
    }

    addEventBtn.addEventListener("click", () => {
      if (selectedDate && eventInput.value.trim() !== "") {
        let key = selectedDate.toLocaleDateString("es-MX");
        if (!events[key]) events[key] = [];
        events[key].push(eventInput.value.trim());

        // Enviar a App Inventor
        let payload = key + " | " + eventInput.value.trim();
        if (window.AppInventor) {
          window.AppInventor.setWebViewString(payload);
        }

        eventInput.value = "";
        showEvents(selectedDate);
      } else {
        alert("Selecciona un día y escribe una nota.");
      }
    });

    prevBtn.addEventListener("click", () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar(currentMonth, currentYear);
    });

    nextBtn.addEventListener("click", () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar(currentMonth, currentYear);
    });

    renderCalendar(currentMonth, currentYear);
  </script>
</body>
</html>
